### Login - SAML-Module config ###
di.saml.sp.entityId=https://os2ilm.test
di.saml.sp.baseUrl=https://os2ilm.test:9050
di.saml.keystore.location=
di.saml.keystore.password=

### LoginAdUserServ - Multi IdP Discovery ###
os2ilm.idps.employeeIdPEntityId=https://login-idp.digital-identity.dk/
os2ilm.idps.employeeIdPMetadata=https://login-idp.digital-identity.dk/sso/saml/metadata
os2ilm.idps.mitIdIdPEntityId=https://demo-idp.os2faktor.dk/
os2ilm.idps.mitIdIdPMetadata=https://demo-idp.os2faktor.dk/sso/saml/metadata

### SSL ###
server.ssl.enabled=true
server.ssl.key-store=config/ssl-dev.pfx
server.ssl.key-store-password=Test1234
server.ssl.key-password=Test1234

### Database ###
spring.datasource.url=jdbc:mysql://localhost/ilm?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Test1234

### Sofd integration ###
os2ilm.sofd.url=https://demo.sofd.io
os2ilm.sofd.apiKey=PLACEAPIKEYHERE

### RoleCatalog integration ###
os2ilm.rc.url=https://demo.rollekatalog.dk
os2ilm.rc.apiKey=PLACEAPIKEYHERE
os2ilm.rc.allowAutomaticUserRoles=true

### CvrService integration ###
os2ilm.integrations.cvr.apiKey=PLACEAPIKEYHERE

# -------------------- Developer settings -------------------- #
