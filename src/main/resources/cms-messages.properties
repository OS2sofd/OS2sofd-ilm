cms.business.prefix=Virksomhedsprefix bruges til oprettelse af ad-konti og gør det muligt at identificere hvilken virksomhed de tilhører.
cms.activate.leader=Hvis dette er aktiv, skal nye medarbejdere angive deres leders email ved registrering. Vi sender derefter mails til lederen om forskellige handlinger de skal foretage sig.
cms.inherit.privileges=Hvis dette er aktiv, bliver indstillingen om at medarbejdere på denne virksomhed skal arve rettigheder i OS2Sofd aktiveret.
cms.sofd.name.generation=Hvis flaget er sat, vil ad-konti i denne virksomhed få deres brugernavne genereret af SOFD.
cms.account.name.strategy=Vælger hvordan brugernavne til AD-konti genereres for medarbejdere i denne virksomhed: ILM genereret (prefix), SOFD genereret, virksomhedstilpasset format, eller manuel indtastning ved godkendelse.
cms.max.days.in.future=Maks antal dage man må oprette en medarbejder i fremtiden. Dette er en grundinstilling som gælder alle medarbejder tilhørende denne virksomhed.
cms.max.employment.days=Maks antal dage man må være ansat for i virksomheden. Dette er en grundinstilling som gælder alle medarbejder tilhørende denne virksomhed.
cms.default.employment.days=Antal dage man som standard er ansat for i virksomheden. Dette er en grundinstilling som gælder alle medarbejder tilhørende denne virksomhed.
cms.tos.text=Tekst der fremgår af de generelle vilkår og privatlivspolitik
cms.landingpage.text=<h2 class="font-bold">Velkommen til OS2ILM</h2><p>Du er blevet inviteret som konsulent. For at komme i gang skal du logge ind med MitID og udfylde nogle få generelle oplysninger om, hvem du er.</p><h3 class="font-bold">Sådan kommer du videre</h3><ol><li>Log ind med MitID via knappen nedenfor.</li><li>Udfyld dine generelle oplysninger (navn, mail og lignende) og accepter vilkår.</li><li>Når oplysningerne er gemt, vil du få besked om når du er blevet godkendt.</li></ol>
cms.landingpage.button=Log ind med MitID
cms.landingpage.help=Knappen logger dig direkte ind med MitID, hvorefter du bliver guidet videre.
cms.sofd.exchange.user=Hvis flaget er sat, vil der automatisk blive bestilt en mailkonto hos SOFD til alle medarbejder i denne virksomhed.
