<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true)}"></head>
<link rel="stylesheet" th:href="@{/css/myAccount.css}">
<link rel="stylesheet" th:href="@{/css/ibox-footer-styling.css}">
<body class="top-navigation">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidemenu (employee = true, employeeId = ${employee.id}, page = 'profile')}"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar}"></div>
        <div class="wrapper wrapper-content">
            <div class="row" id="myAccount">
                <div class="col-md-12" style="margin-top: 20px">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-fw fa-user"></em> &nbsp; Min profil </h5>
                        </div>
                        <div class="ibox-content">
                            <p>
                                Her kan du se din profil og foretage nogle ændringer.
                            </p>
                            <span>
                                <h4>
                                    Kontaktoplysninger
                                </h4>
                            </span>
                            <div class="col-md-12" style="margin-top: 20px">
                                <div class="row">
                                    <div class="col-md-4 form-group">
                                        <label class="col-form-label">Navn</label>
                                        <input type="text" th:value="${employee?.name}" id="nameInput" class="form-control" readonly>
                                    </div>
                                    <div class="col-md-4 form-group">
                                        <label class="col-form-label">Mobilnummer</label>
                                        <input type="text" th:value="${employee?.phone}" id="phoneInput" class="form-control" readonly>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-4 form-group">
                                        <label class="col-form-label">Brugernavn</label>
                                        <input type="text" th:value="${employee?.user?.name}" id="accountInput" class="form-control" readonly>
                                    </div>
                                </div>
                            </div>
                            <span>
                                <h4>
                                    Adgangsdatoer
                                </h4>
                            </span>
                            <div class="col-md-12" style="margin-top: 20px">
                                <div class="row">
                                    <div class="col-md-4 form-group">
                                        <label class="col-form-label">Start dato</label>
                                        <input type="text" th:value="${employee?.startDate}" class="form-control" readonly>
                                    </div>
                                    <div class="col-md-4 form-group">
                                        <label class="col-form-label">Stop dato</label>
                                        <input type="text" th:value="${employee?.stopDate}" class="form-control" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="ibox-footer">
                            <div class="row">
                                <div class="col-md-6">
                                    <th:block th:if="${alternativeResetPasswordLink == null or #authorization.expression('hasRole(''ROLE_SYSTEM_ADMINISTRATOR'')')}">
                                        <button type="button" th:data-id="${employee.id}" id="resetPasswordBtn" class="btn btn-w-m btn-primary">Nulstil AD Kodeord</button>
                                    </th:block>

                                    <th:block th:unless="${alternativeResetPasswordLink == null or #authorization.expression('hasRole(''ROLE_SYSTEM_ADMINISTRATOR'')')}">
                                        <a th:href="${alternativeResetPasswordLink}" th:data-id="${employee.id}" class="btn btn-w-m btn-primary" style="width: 120px !important;">Skift AD Kodeord &nbsp;<i class="fa fa-external-link" aria-hidden="true"></i></a>
                                    </th:block>
                                    <button type="button" th:data-id="${employee.id}" id="requestExtensionBtn" class="btn btn-w-m btn-warning">Anmod om forlængelse</button>
                                </div>
                                <div class="col-md-6 text-right">
                                    <button type="button" id="enableEditProfileBtn" class="btn btn-w-m btn-primary">Rediger profil</button>
                                    <button type="button" id="cancelEditProfileBtn" class="btn btn-w-m btn-danger">Annuller</button>
                                    <button type="button" id="saveEditProfileBtn" th:data-id="${employee.id}" class="btn btn-w-m btn-primary">Gem</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/footer :: scripts (datatables = true)}"></div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>
<script type="module" th:src="@{/js/profile/profile.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
