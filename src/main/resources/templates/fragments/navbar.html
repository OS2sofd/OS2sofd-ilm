<!DOCTYPE html>
<html>
<body>
	<div th:fragment="topbar" class="row border-bottom white-bg">
		<nav class="navbar navbar-expand-lg navbar-static-top" role="navigation"> &nbsp; &nbsp;

			<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbar" aria-expanded="true" aria-label="Toggle navigation">
				<i class="fa fa-reorder"></i>
			</button>

			<ul class="nav navbar-nav mr-auto" id="top-menu">
				<li sec:authorize="hasRole('ROLE_SYSTEM_ADMINISTRATOR') || hasRole('ROLE_SYSTEM_READONLY')" th:class="${page != null && (#strings.startsWith(page, 'archetypes') || #strings.startsWith(page, 'activation') || #strings.startsWith(page, 'business') || #strings.startsWith(page, 'auditlog') || #strings.startsWith(page, 'cms') || #strings.startsWith(page, 'accounts') || #strings.startsWith(page, 'invitation')) ? 'active' : ''}">
				<a class="nav-link active" role="button" th:href="@{/admin/auditlog}">Administration</a>
				</li>
                <li sec:authorize="(hasRole('ROLE_SYSTEM_ADMINISTRATOR') || hasRole('ROLE_EMPLOYEE_ADMINISTRATOR') || hasRole('ROLE_SYSTEM_READONLY'))" th:class="${page != null && (#strings.startsWith(page, 'approve') || #strings.startsWith(page, 'employee')) ? 'active' : ''}">
                    <a class="nav-link active" role="button" th:href="@{/employees/overview}">Medarbejdere</a>
                </li>
                <li sec:authorize="(hasRole('ROLE_EMPLOYEE'))" th:class="${page != null && #strings.startsWith(page, 'profile') ? 'active' : ''}">
                    <a class="nav-link active" role="button" th:href="@{/employee/my/account/{id}(id=${@securityUtil.getEmployee().orElse(null)?.getId()})}">Profil</a>
                </li>
                <li sec:authorize="(hasRole('ROLE_SYSTEM_ADMINISTRATOR') || hasRole('ROLE_EMPLOYEE_ADMINISTRATOR') || hasRole('ROLE_SYSTEM_READONLY'))" th:class="${page != null && #strings.startsWith(page, 'changelog') ? 'active' : ''}">
                    <a class="nav-link active" role="button" th:href="@{/admin/changelog}">Ændringslog</a>
                </li>
			</ul>
			<ul sec:authorize="isAuthenticated()" class="nav navbar-top-links navbar-right">
				<li>
					<a class="navbar-version" th:text="'Version ' + ${appVersion}"></a>
				</li>
				<li th:if="${latestVersion != null and latestVersion != appVersion}">
					<a class="navbar-version-outdated" th:title="'Ny version tilgængelig: ' + ${latestVersion}">
						<i class="fa fa-fw fa-exclamation-triangle"></i> Ny version tilgængelig
					</a>
				</li>
			</ul>
		</nav>
	</div>
</body>
</html>
