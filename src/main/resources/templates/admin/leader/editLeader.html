<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true, checkbox = true)}"></head>
<link rel="stylesheet" th:href="@{/css/ibox-footer-styling.css}">
<body class="top-navigation">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidemenu (admin = true, page = 'leader')}"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar (page = 'leader')}"></div>
        <div class="wrapper wrapper-content">
            <div class="row" id="editLeader">
                <div class="col-md-12" style="margin-top: 20px">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-fw fa-pencil"></em> &nbsp; Rediger leder </h5>
                        </div>

                        <div class="ibox-content" >
                            <input type="hidden" id="leaderId" th:value="${leader.id}">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h4 style="margin: 0;">Stamdata</h4>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label"><strong>Navn *</strong></label>
                                <div class="col-sm-10" style="margin-bottom: 10px">
                                    <input id="leaderName" class="form-control" placeholder="Navn" th:attr="value=${leader.name}">
                                </div>
                                <label class="col-sm-2 col-form-label"><strong>Email</strong></label>
                                <div class="col-sm-10" style="margin-bottom: 10px">
                                    <input id="leaderMail" class="form-control" placeholder="Email" th:attr="value=${leader.mail}">
                                </div>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h4 style="margin: 0;">Login-oplysninger</h4>
                                <small class="text-muted">Udfyld kun én af felterne nedenfor</small>
                            </div>
                            <div class="form-group row">
                                <label for="leaderMitIdUuid" class="col-sm-2 col-form-label"><strong>MitID UUID</strong></label>
                                <div class="col-sm-10" style="margin-bottom: 10px">
                                    <input id="leaderMitIdUuid" class="form-control" placeholder="MitID Erhverv UUID" th:attr="value=${leader.mitIdUuid}">
                                </div>
                                <label for="leaderInternalUuid" class="col-sm-2 col-form-label"><strong>Kommune ID</strong></label>
                                <div class="col-sm-10" style="margin-bottom: 10px">
                                    <input id="leaderInternalUuid" class="form-control" placeholder="Kommunens IdP bruger-ID" th:attr="value=${leader.internalUuid}">
                                </div>
                                <label for="leaderCprNumber" class="col-sm-2 col-form-label"><strong>Cpr-nummer</strong></label>
                                <div class="col-sm-10" style="margin-bottom: 10px">
                                    <input id="leaderCprNumber" class="form-control" placeholder="Cpr-nummer" th:attr="value=${leader.cpr}">
                                </div>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h4 style="margin: 0;">Virksomheder *</h4>
                            </div>
                            <div class="form-group row">
                                <div class="col-md-12">
                                    <div class="table-responsive">
                                        <table id="businessTable" class="table table-striped table-bordered table-hover" >
                                            <thead>
                                            <tr>
                                                <th>Navn</th>
                                                <th>CVR</th>
                                                <th>Vælg</th>
                                            </tr>
                                            </thead>
                                            <tfoot style="display: table-row-group">
                                            <tr>
                                                <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                                <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                                <td></td>
                                            </tr>
                                            </tfoot>
                                            <tbody>
                                            <tr th:each="business : ${businesses}">
                                                <td th:value="${business.id}" th:text="${business.name}"></td>
                                                <td th:text="${business.cvr}"></td>
                                                <td>
                                                    <input type="checkbox"
                                                           th:id="${'businessChoice' + business.id}"
                                                           class="i-checks businessCheckbox"
                                                           th:data-id="${business.id}"
                                                           th:checked="${leaderBusinessIds.contains(business.id)}">
                                                </td>
                                            </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="ibox-footer">
                            <div class="form-group row">
                                <div class="col-sm-12 text-right">
                                    <button id="cancel" class="btn btn-w-m btn-danger">Annuller</button> &nbsp;
                                    <button id="confirmEdit" class="btn btn-w-m btn-primary">Gem</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/footer :: scripts (datatables = true, checkbox = true)}"></div>
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
</div>
<script type="module" th:src="@{/js/admin/leader/leader.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
