<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true, jstree = true)}"></head>
<body class="top-navigation">

        <div class="wrapper wrapper-content">

                        <div class="ibox-content" >

                                Her kan du godkende medarbejdere der har sendt en anmodning.
                            </p>
                            <div class="table-responsive">
                                <table id="approveTable" class="table table-striped table-bordered table-hover" >
                                    <thead>
                                    <tr>
                                        <th>Navn</th>
                                        <th>Cpr</th>
                                        <th>Cvr</th>
                                        <th>Status</th>
                                        <th>Handlinger</th>
                                    </tr>
                                    </thead>

                                    <tfoot style="display: table-row-group">
                                    <tr>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>

                                        <td></td>
                                    </tr>
                                    </tfoot>
                                    <tbody>
                                    </tbody>
                                </table>
                            </div>
                            <div style="display: none;" id="isAdmin" th:data-admin="${isAdmin}"></div>
                            <div style="display: none;" id="isLeader" th:data-leader="${isLeader}"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/footer :: scripts (datatables = true, jstree = true)}"></div>
            <div th:replace="~{fragments/footer :: footer (jstree = true)}"></div>
        </div>
    </div>
</div>
<script type="text/javascript" th:src="@{/js/admin/employees/approve.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
