<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true, texteditor = true, codemirror = true)}"></head>
<body class="top-navigation">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidemenu (leader = true, page = 'employee')}"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar (page = 'employee')}"></div>
        <div class="wrapper wrapper-content">
            <div class="row" id="employeeDetails">
                <div class="col-md-12" style="margin-top: 20px">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-fw fa-building"></em> &nbsp; Medarbejder</h5>
                        </div>

                        <div class="ibox-content" >
                            <p>
                            Her kan der ses detailer om medarbejderen.
                            </p>
                            <div>
                                <h4>Stamdata</h4>
                            </div>
                            <form>
                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label">Navn</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" disabled="disabled" th:value="${employee?.name}"/>
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label">E-Mail</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" disabled="disabled" th:value="${employee?.email}"/>
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label">Mobilnummer</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" disabled="disabled" placeholder="Ikke angivet" th:value="${employee?.phone}"/>
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label">Cvr</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control"  disabled="disabled" th:value="${employee?.cvr}"/>
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label">AD-konto</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" disabled="disabled" placeholder="Ikke tildelt" th:value="${employee?.user?.name}"/>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/footer :: scripts (datatables = true, texteditor = true, codemirror = true)}"></div>
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
</div>
</body>
</html>
