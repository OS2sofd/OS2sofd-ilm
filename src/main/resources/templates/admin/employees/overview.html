<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true, datepicker = true, checkbox = true)}"></head>
<body class="top-navigation">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidemenu (leader = true, page = 'employee')}"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar (page = 'employee')}"></div>
        <div class="wrapper wrapper-content">
            <div class="row" id="employees">
                <div class="col-md-12" style="margin-top: 20px">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-fw fa-users"></em> &nbsp; Medarbejdere </h5>
                        </div>

                        <div class="ibox-content" >
                            <p>
                                Her har du et overblik over alle medarbejder i systemet og har mulighed for at oprette og redigere dem.
                            </p>
                            <a th:if="${isLeader == true}" href="/employee/create" style="float: right" class="btn btn-w-m btn-primary mb-4">Opret</a>
                            <a th:if="${isAdmin == true}" href="/employee/admin/create" style="float: right" class="btn btn-w-m btn-primary mb-4">Opret</a>
                            <div class="btn-group mb-4">
                                <button class="btn btn-primary dropdown-toggle" id="toggleColumnOptionsButton" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"><em class="fa fa-fw fa-gear"></em></button>
                                <div class="dropdown-menu p-3" id="columnOptionsMenu">
                                    <div class="mb-1"><label><input type="checkbox" class="i-checks column-toggle" data-column="0" checked /> Navn</label></div>
                                    <div class="mb-1"><label><input type="checkbox" class="i-checks column-toggle" data-column="1" checked /> Virksomhed</label></div>
                                    <div class="mb-1"><label><input type="checkbox" class="i-checks column-toggle" data-column="2" checked /> CVR</label></div>
                                    <div class="mb-1"><label><input type="checkbox" class="i-checks column-toggle" data-column="3" checked /> Enhed</label></div>
                                    <div class="mb-1"><label><input type="checkbox" class="i-checks column-toggle" data-column="4" checked /> Brugernavn</label></div>
                                    <div class="mb-1"><label><input type="checkbox" class="i-checks column-toggle" data-column="5" checked /> Start dato</label></div>
                                    <div class="mb-1"><label><input type="checkbox" class="i-checks column-toggle" data-column="6" checked /> Stop dato</label></div>
                                    <div class="mb-1"><label><input type="checkbox" class="i-checks column-toggle" data-column="7" checked /> Godkendt</label></div>
                                    <div class="mb-1"><label><input type="checkbox" class="i-checks column-toggle" data-column="8" checked /> Ekstern overførsel</label></div>
                                    <div class="mb-1"><label><input type="checkbox" class="i-checks column-toggle" data-column="9" checked /> Mailkonto</label></div>
                                    <div class="dropdown-divider"></div>
                                    <button type="button" class="btn btn-primary" id="updateColumnsButton">Opdater</button>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <table id="employeeTable" class="table table-striped table-bordered table-hover" >
                                    <thead>
                                        <tr>
                                            <th>Navn</th>
                                            <th>Virksomhed</th>
                                            <th>CVR</th>
                                            <th>Enhed</th>
                                            <th>Brugernavn</th>
                                            <th>Start dato</th>
                                            <th>Stop dato</th>
                                            <th>Godkendt</th>
                                            <th>Ekstern overførsel</th>
                                            <th>Mailkonto</th>
                                            <th>Handlinger</th>
                                        </tr>
                                    </thead>

                                    <tfoot style="display: table-row-group">
                                        <tr>
                                            <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                            <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                            <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                            <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                            <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                            <td class="input-filter">
                                                <div class="input-group input-group-sm">
                                                    <input type="text" class="form-control date-filter" placeholder="DD/MM/ÅÅÅÅ" />
                                                    <span class="input-group-addon">
                                                        <i class="fa fa-calendar"></i>
                                                    </span>
                                                </div>
                                            </td>
                                            <td class="input-filter">
                                                <div class="input-group input-group-sm">
                                                    <input type="text" class="form-control date-filter" placeholder="DD/MM/ÅÅÅÅ" />
                                                    <span class="input-group-addon">
                                                        <i class="fa fa-calendar"></i>
                                                    </span>
                                                </div>
                                            </td>
                                            <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                            <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                            <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                            <td></td>
                                        </tr>
                                    </tfoot>
                                    <tbody>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/footer :: scripts (datatables = true, datepicker = true, checkbox = true)}"></div>
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
</div>
<div style="display: none;" id="isAdmin" th:data-admin="${isAdmin}"></div>
<div style="display: none;" id="isLeader" th:data-leader="${isLeader}"></div>
<div style="display: none;" id="passwordResetLink" th:data-reset-url="${passwordResetLinkUrl}"></div>
<script type="module" th:src="@{/js/admin/employees/employees.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
