<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true, texteditor = true, checkbox = true)}"></head>
<link rel="stylesheet" th:href="@{/webjars/clockpicker/0.0.7/dist/bootstrap-clockpicker.min.css}" />
<body class="top-navigation">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidemenu (admin = true, page = 'activation')}"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar (page = 'activation')}"></div>
        <div class="wrapper wrapper-content">
            <div class="row" id="createActivation">
                <div class="col-md-12" style="margin-top: 20px">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-fw fa-clock-o"></em> &nbsp;Rediger aktiveringsperiode</h5>
                        </div>
                        <div class="ibox-content" >
                            <p>
                                Her kan du redigere en eksisterende aktiveringsperiode.
                            </p>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label"><strong>Navn</strong></label>
                                <div class="col-sm-10" style="margin-bottom: 10px">
                                    <input th:value="${activation?.name}" type="text" id="editActivationName" class="form-control">
                                </div>
                                <label class="col-sm-2 col-form-label"><strong>Start tidspunkt</strong></label>
                                <div class="col-sm-10 input-group clockpicker" style="margin-bottom: 10px">
                                    <input th:value="${activation?.startTime}" type="text" id="editActivationStart" class="form-control">
                                    <span class="input-group-addon">
                                        <span class="fa fa-fw fa-clock-o"></span>
                                    </span>
                                </div>
                                <label class="col-sm-2 col-form-label" style="white-space: nowrap"><strong>Stop tidspunkt</strong></label>
                                <div class="col-sm-10 input-group clockpicker" style="margin-bottom: 10px">
                                    <input th:value="${activation?.stopTime}" type="text" id="editActivationStop" class="form-control">
                                    <span class="input-group-addon">
                                        <span class="fa fa-fw fa-clock-o"></span>
                                    </span>
                                </div>
                                <label class="col-sm-2 col-form-label" style="white-space: nowrap"><strong>Ekskluder weekend</strong></label>
                                <div class="col-sm-10">
                                    <input type="checkbox" th:checked="${activation.isExcludeWeekends()}" id="editWeekend" class="i-checks">
                                </div>
                            </div>
                            <div class="ibox">
                                <div class="ibox-footer">
                                    <div class="form-group row">
                                        <div style="text-align: right" class="col-sm-12">
                                            <button onclick="editActivationService.cancelButton()" id="annuller" class="btn btn-w-m btn-danger">Annuller</button> &nbsp;
                                            <button th:data-id="${activation.id}" onclick="editActivationService.updateActivation(this)" id="godkend" class="btn btn-w-m btn-primary">Bekræft</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/footer :: scripts (datatables = true, texteditor = true, checkbox = true)}"></div>
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
<script type="text/javascript" th:src="@{/js/admin/ad/editActivations.js}"></script>
<script th:src="@{/webjars/clockpicker/0.0.7/dist/bootstrap-clockpicker.min.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
