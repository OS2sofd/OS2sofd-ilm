<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true, texteditor = true, checkbox = true)}">
    <link rel="stylesheet" th:href="@{/webjars/clockpicker/0.0.7/dist/bootstrap-clockpicker.min.css}" />
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.css">
</head>
<body class="top-navigation">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidemenu (admin = true, page = 'activation')}"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar (page = 'activation')}"></div>
        <div class="wrapper wrapper-content">
            <div class="row" id="activation">
                <div class="col-md-12" style="margin-top: 20px">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-fw fa-clock-o"></em> &nbsp;Aktiveringsperioder</h5>
                        </div>
                        <div class="ibox-content">
                            <button th:if="${isAdmin || isLeader}" type="button" onclick="window.location.href='/admin/ad/activation/create';" style="float: right" class="btn btn-w-m btn-primary">Opret</button>
                            <div class="table-responsive">
                                <table id="activationTable" class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr>
                                        <th>Navn</th>
                                        <th>Start tidspunkt</th>
                                        <th>Slut tidspunkt</th>
                                        <th>Weekend</th>
                                        <th>Handlinger</th>
                                    </tr>
                                    </thead>

                                    <tfoot style="display: table-row-group">
                                    <tr>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm time-filter" style="width: 100%;" placeholder="--:--" /></td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm time-filter" style="width: 100%;" placeholder="--:--" /></td>
                                        <td class="input-filter"><input type="checkbox" class="i-checks form-control input-sm" style="width: 100%;" /></td>
                                        <td></td>
                                    </tr>
                                    </tfoot>

                                    <tbody>
                                    <tr th:each="item : ${activations}">
                                        <td th:value="${item.getId()}" th:text="${item.getName()}"></td>
                                        <td th:value="${item.getId()}" th:text="${item.getStartTime()}"></td>
                                        <td th:value="${item.getId()}" th:text="${item.getStopTime()}"></td>
                                        <td>
                                            <span th:if="${item?.isExcludeWeekends() == true}">Ikke inkluderet</span>
                                            <span th:if="${item?.isExcludeWeekends() == false}">Inkluderet</span>
                                        </td>
                                        <td>
                                            <span>
                                                <a th:if="${isAdmin || isLeader}" th:data-id="${item?.id}" onclick="activationService.editActivation(this)"><em class="fa fa-fw fa-pencil"></em></a>
                                                <a th:if="${isAdmin || isLeader}" th:data-id="${item?.id}" onclick="activationService.deleteActivation(this)"><em class="fa fa-fw fa-times"></em></a>
                                            </span>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/footer :: scripts (datatables = true, texteditor = true, checkbox = true)}"></div>
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
</div>
<script type="text/javascript" th:src="@{/js/admin/ad/activations.js}"></script>
<script th:src="@{/webjars/clockpicker/0.0.7/dist/bootstrap-clockpicker.min.js}"></script>
<script src="//cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.js"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
