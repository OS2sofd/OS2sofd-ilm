<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true)}"></head>
<body class="top-navigation">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidemenu (admin = true, page = 'emailtemplate')}"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar (page = 'emailtemplate')}"></div>
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-md-12" style="margin-top: 20px;">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-fw fa-envelope"></em> &nbsp; Mailskabeloner</h5>
                        </div>

                        <div class="ibox-content">
                            <p>
                                Nedenfor listes alle de beskeder som OS2ILM sender via e-boks/email. Du kan redigere emnefelt og indhold,
                                samt slå den enkelte besked til eller fra. Er en skabelon inaktiv, sendes beskeden ikke.
                            </p>

                            <div class="table-responsive">
                                <table id="emailTemplateTable" class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr>
                                        <th>Skabelon</th>
                                        <th>Emne</th>
                                        <th>Status</th>
                                        <th>Handlinger</th>
                                    </tr>
                                    </thead>
                                    <tfoot style="display: table-row-group">
                                    <tr>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter">
                                            <select class="form-control input-sm">
                                                <option value="" selected="selected">Alle</option>
                                                <option value="Aktiv">Aktiv</option>
                                                <option value="Inaktiv">Inaktiv</option>
                                            </select>
                                        </td>
                                        <td></td>
                                    </tr>
                                    </tfoot>
                                    <tbody>
                                    <tr th:each="template : ${templates}">
                                        <td>
                                            <strong th:text="${template.templateType.title}"></strong>
                                            <br/>
                                            <small class="text-muted" th:text="${template.templateType.description}"></small>
                                        </td>
                                        <td th:text="${template.subject}"></td>
                                        <td th:text="${template.enabled ? 'Aktiv' : 'Inaktiv'}"></td>
                                        <td>
                                            <a sec:authorize="hasRole('ROLE_SYSTEM_ADMINISTRATOR')" th:href="@{/admin/emailtemplate/edit/{id}(id=${template.id})}" title="Rediger skabelon">
                                                <em style="color: #212529" class="fa fa-fw fa-pencil"></em>
                                            </a>
                                            <a sec:authorize="hasRole('ROLE_SYSTEM_ADMINISTRATOR')" class="js-template-enable-btn" th:unless="${template.enabled}" th:data-id="${template.id}" title="Aktiver skabelon">
                                                <em style="color: #212529" class="fa fa-fw fa-check"></em>
                                            </a>
                                            <a sec:authorize="hasRole('ROLE_SYSTEM_ADMINISTRATOR')" class="js-template-disable-btn" th:if="${template.enabled}" th:data-id="${template.id}" title="Deaktiver skabelon">
                                                <em style="color: #212529" class="fa fa-fw fa-close"></em>
                                            </a>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/footer :: scripts (datatables = true)}"></div>
        </div>
    </div>
</div>
<script type="module" th:src="@{/js/admin/emailtemplate/list.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
