<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true)}"></head>
<body class="top-navigation">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidemenu (admin = true, page = 'cms')}"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar (page = 'cms')}"></div>
        <div class="wrapper wrapper-content">
            <div class="row" id="cms">
                <div class="col-md-12" style="margin-top: 20px;">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-fw fa-cog"></em> &nbsp; CMS beskeder</h5>
                        </div>

                        <div class="ibox-content" >
                            <p>
                                Nedenfor listes alle de steder, hvor du kan redigere CMS tekster. Hvis der ikke er noget uddrag angivet vil teksten ikke fremgå af brugergænsefladen.
                                Det kan tage op til 5 minutter før ændringer slår igennem
                            </p>
                            <div>
                                <h4>CMS-beskeder</h4>
                            </div>
                            <div class="table-responsive">
                                <table style="padding-right:0px !important;" id="cmsTable" class="table table-striped table-bordered table-hover" >
                                    <thead>
                                    <tr>
                                        <th>Beskrivelse</th>
                                        <th>Uddrag af teksten</th>
                                        <th>Rediger</th>
                                    </tr>
                                    </thead>
                                    <tfoot style="display: table-row-group">
                                    <tr>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                    </tr>
                                    </tfoot>
                                    <tbody>
                                    <tr th:each="cms : ${cmsMessage}">
                                        <td th:text="${cms.description}"></td>
                                        <td th:if="*{cms.key == 'cms.logo'}" th:text="${#strings.isEmpty(@cmsMessageBundle.getText(cms.key, true)) ? 'Intet logo opsat' : 'Logo opsat'}"></td>
                                        <td th:if="*{cms.key != 'cms.logo'}" th:text="${#strings.abbreviate(@cmsMessageBundle.getText(cms.key, true), 100)}"></td>
                                        <td><a sec:authorize="(hasRole('ROLE_SYSTEM_ADMINISTRATOR'))" th:href="${'/admin/cms-edit?key=' + cms.key}"><em style="color: #212529" class="fa fa-fw fa-pencil"></em></a> <a sec:authorize="(hasRole('ROLE_SYSTEM_ADMINISTRATOR'))"><em class="fa fa-fw fa-times" th:data-id="${cms.key()}" onclick="cmsService.delete(this);"></em></a></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/footer :: scripts (datatables = true)}"></div>
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
</div>
<script type="text/javascript" th:src="@{/js/admin/cms/cms.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
