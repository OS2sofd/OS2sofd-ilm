<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true, checkbox = true)}"></head>
<body class="top-navigation">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidemenu (admin = true, page = 'cms')}"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar (page = 'cms')}"></div>
        <div class="wrapper wrapper-content">
            <div class="row" id="cms">
                <div class="col-md-12" style="margin-top: 20px;">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-fw fa-cog"></em> &nbsp; CMS beskeder</h5>
                        </div>

                        <div class="ibox-content" >
                            <p>
                                Nedenfor listes alle de steder, hvor du kan redigere CMS tekster. Hvis der ikke er noget uddrag angivet vil teksten ikke fremgå af brugergænsefladen.
                                Det kan tage op til 5 minutter før ændringer slår igennem
                            </p>
                            <div>
                                <h4>CMS-beskeder</h4>
                            </div>
                            <hr>
                            <div>
                                <div class="table-responsive">
                                    <table style="padding-right:0px !important;" id="cmsTextTable" class="table table-striped table-bordered table-hover" >
                                        <thead>
                                        <tr>
                                            <th>Beskrivelse</th>
                                            <th>Uddrag af teksten</th>
                                            <th>Aktiv</th>
                                            <th>Rediger</th>
                                        </tr>
                                        </thead>
                                        <tfoot style="display: table-row-group">
                                        <tr>
                                            <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                            <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                            <td class="input-filter">
                                                <select class="form-control input-sm">
                                                    <option value="">Alle</option>
                                                    <option value="AKTIV" selected="selected">Aktiv</option>
                                                    <option value="INAKTIV">Inaktiv</option>
                                                </select>
                                            </td>
                                            <td></td>
                                        </tr>
                                        </tfoot>
                                        <tbody>
                                        <tr th:each="cms : ${cmsText}">
                                            <td th:text="${cms.description}"></td>
                                            <td th:if="*{cms.key == 'cms.logo'}" th:text="${#strings.isEmpty(@cmsMessageBundle.getText(cms.key, true)) ? 'Intet logo opsat' : 'Logo opsat'}"></td>
                                            <td th:if="*{cms.key != 'cms.logo'}" th:text="${#strings.abbreviate(@cmsMessageBundle.getText(cms.key, true), 100)}"></td>
                                            <td th:text="${@cmsMessageBundle.getActive(cms.key) ? 'Aktiv' : 'Inaktiv'}"></td>
                                            <td>
                                                <a sec:authorize="(hasRole('ROLE_SYSTEM_ADMINISTRATOR'))" th:href="${'/admin/cms-edit?key=' + cms.key}"><em style="color: #212529" class="fa fa-fw fa-pencil"></em></a>
                                                <a sec:authorize="(hasRole('ROLE_SYSTEM_ADMINISTRATOR'))" class="cmsDeleteBtn" th:data-id="${cms.key()}"><em class="fa fa-fw fa-trash"></em></a>
                                                <span sec:authorize="(hasRole('ROLE_SYSTEM_ADMINISTRATOR'))" class="button-container">
                                                    <a class="cmsActivateBtn" th:unless="${@cmsMessageBundle.getActive(cms.key)}" th:data-key="${cms.key}" th:data-text="${@cmsMessageBundle.getText(cms.key, true)}">
                                                        <em style="color: #212529" class="fa fa-fw fa-check" title="Aktiver skabelon"></em>
                                                    </a>
                                                    <a class="cmsDeactivateBtn" th:if="${@cmsMessageBundle.getActive(cms.key)}" th:data-key="${cms.key}" th:data-text="${@cmsMessageBundle.getText(cms.key, true)}">
                                                        <em style="color: #212529" class="fa fa-fw fa-close" title="Deaktiver skabelon"></em>
                                                    </a>
                                                </span>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/footer :: scripts (datatables = true, checkbox = true)}"></div>
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
</div>
<script type="module" th:src="@{/js/admin/cms/cms.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
