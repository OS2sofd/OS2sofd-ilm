<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true, datepicker = true)}"></head>
<body class="top-navigation">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidemenu (admin = true, page = 'business')}"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar (page = 'business')}"></div>
        <div class="wrapper wrapper-content">
            <div class="row" id="editAgency">
                <div class="col-md-12" style="margin-top: 20px">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-fw fa-pencil"></em> &nbsp; Rediger en virksomhed </h5>
                        </div>

                        <div class="ibox-content" >
                            <p>
                                Her kan du redigere en virksomhed.
                            </p>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label"><strong>Navn</strong></label>
                                <div class="col-sm-10" style="margin-bottom: 10px;">
                                    <input id="agencyName" class="form-control" th:value="${business?.name}">
                                </div>
                                <label class="col-sm-2 col-form-label" style="white-space: nowrap">
                                    <strong>Virksomhedsprefix</strong>
                                    <span style="margin-left: 5px; cursor: pointer;" data-toggle="tooltip" data-placement="top" th:attrappend="title=${@cmsMessageBundle.getText('cms.business.prefix')}">
                                        <i class="fa fa-fw fa-info-circle" aria-hidden="true"></i>
                                    </span>
                                </label>
                                <div class="col-sm-10">
                                    <input id="agencyPrefix" class="form-control personMasterTooltip" th:value="${business?.prefix}">
                                </div>
                            </div>
                            <div class="ibox">
                                <div class="ibox-footer">
                                    <div class="form-group row">
                                        <div style="text-align: right" class="col-sm-12">
                                            <button id="annuller" onclick="businessService.cancelButton()" class="btn btn-w-m btn-danger">Annuller</button> &nbsp;
                                            <button th:data-id="${business.id}" onclick="businessService.saveEditedAgency(this)" id="bekræft" class="btn btn-w-m btn-primary">Bekræft</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/footer :: scripts (datatables = true, datepicker = true)}"></div>
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
</div>
<script type="text/javascript" th:src="@{/js/admin/business/business.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
