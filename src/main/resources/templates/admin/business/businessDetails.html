<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true, texteditor = true, codemirror = true, datepicker = true, checkbox = true)}"></head>
<body class="top-navigation">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidemenu (admin = true, page = 'business')}"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar (page = 'business')}"></div>
        <div class="wrapper wrapper-content">
            <div class="row" id="agencyDetails">
                <div class="col-md-12" style="margin-top: 20px">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-fw fa-building"></em> &nbsp; Virksomhed</h5>
                        </div>

                        <div class="ibox-content" >
                            <p>
                            Her kan der ses detailer om virksomheden.
                            </p>
                            <div>
                                <h4>Stamdata</h4>
                            </div>
                            <form>
                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label"><strong>Navn</strong></label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" disabled="disabled" th:value="${business.name}"/>
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label"><strong>Cvr</strong></label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" disabled="disabled" th:value="${business.cvr}"/>
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label"><strong>Navngivningsstrategi</strong></label>
                                    <div class="col-sm-10" th:switch="${business?.businessEmploymentSettings?.nameStrategy?.name()}">
                                        <input type="text" class="form-control" disabled="disabled" th:case="'SOFD'" value="SOFD genereret"/>
                                        <input type="text" class="form-control" disabled="disabled" th:case="'TAILORED'" value="Virksomhedstilpasset"/>
                                        <input type="text" class="form-control" disabled="disabled" th:case="'CUSTOM'" value="Manuel"/>
                                        <input type="text" class="form-control" disabled="disabled" th:case="*" value="ILM genereret (prefix)"/>
                                    </div>
                                </div>

                                <div class="form-group row" th:if="${business?.businessEmploymentSettings?.nameStrategy == null or business?.businessEmploymentSettings?.nameStrategy.name() == 'PREFIXED'}">
                                    <label class="col-sm-2 col-form-label"><strong>Virksomhedsprefix</strong></label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" disabled="disabled" th:value="${business.prefix}"/>
                                    </div>
                                </div>

                                <div class="form-group row" th:if="${business?.businessEmploymentSettings?.nameStrategy?.name() == 'TAILORED'}">
                                    <label class="col-sm-2 col-form-label"><strong>Brugernavnsformat</strong></label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" disabled="disabled" th:value="${business.businessEmploymentSettings.accountNameTemplate}"/>
                                    </div>
                                </div>
                            </form>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label" style="white-space: nowrap"><strong>Standard aktiveringsperiode</strong></label>
                                <div class="col-sm-10" style="margin-bottom: 10px;">
                                    <input id="activationSelect" class="form-control personMasterTooltip" th:value="${activation?.getDescription()}" readonly>
                                </div>
                                <label class="col-sm-2 col-form-label" style="white-space: nowrap">
                                    <strong>Maks dage i fremtiden</strong>
                                    <span style="margin-left: 5px; cursor: pointer;" data-toggle="tooltip" data-placement="top" th:attrappend="title=${@cmsMessageBundle.getText('cms.max.days.in.future')}">
                                        <i class="fa fa-fw fa-info-circle" aria-hidden="true"></i>
                                    </span>
                                </label>
                                <div class="col-sm-10" style="margin-bottom: 10px">
                                    <input id="createMaxDaysInFuture" class="form-control personMasterTooltip" th:value="${business?.businessEmploymentSettings?.maxFutureDays}" readonly>
                                </div>
                                <label class="col-sm-2 col-form-label" style="white-space: nowrap">
                                    <strong>Maks antal dage for ansættelse</strong>
                                    <span style="margin-left: 5px; cursor: pointer;" data-toggle="tooltip" data-placement="top" th:attrappend="title=${@cmsMessageBundle.getText('cms.max.employment.days')}">
                                        <i class="fa fa-fw fa-info-circle" aria-hidden="true"></i>
                                    </span>
                                </label>
                                <div class="col-sm-10" style="margin-bottom: 10px">
                                    <input id="createMaxEmploymentDays" class="form-control personMasterTooltip" th:value="${business?.businessEmploymentSettings?.maxEmploymentDays}" readonly>
                                </div>
                                <label class="col-sm-2 col-form-label" style="white-space: nowrap">
                                    <strong>Standard antal dage for ansættelse</strong>
                                    <span style="margin-left: 5px; cursor: pointer;" data-toggle="tooltip" data-placement="top" th:attrappend="title=${@cmsMessageBundle.getText('cms.default.employment.days')}">
                                        <i class="fa fa-fw fa-info-circle" aria-hidden="true"></i>
                                    </span>
                                </label>
                                <div class="col-sm-10" style="margin-bottom: 10px">
                                    <input id="createDefaultEmploymentDays" class="form-control personMasterTooltip" th:value="${business?.businessEmploymentSettings?.defaultEmploymentDays}" readonly>
                                </div>
                                <label class="col-sm-2 col-form-label" style="white-space: nowrap"><strong>Standard Enhed</strong></label>
                                <div class="col-sm-10 d-flex align-content-center" style="margin-bottom: 10px;">
                                    <input type="text" id="entity" class="form-control personMasterTooltip" th:value="${business?.defaultOrgUnit?.name}" readonly>
                                </div>
                                <label class="col-sm-2 col-form-label" style="white-space: nowrap">
                                    <strong>Aktivér leder</strong>
                                    <span style="margin-left: 5px; cursor: pointer;" data-toggle="tooltip" data-placement="top" th:attrappend="title=${@cmsMessageBundle.getText('cms.activate.leader')}">
                                        <i class="fa fa-fw fa-info-circle" aria-hidden="true"></i>
                                    </span>
                                </label>
                                <div class="col-sm-10 d-flex align-content-center">
                                    <input type="checkbox" class="i-checks" id="activeLeader" th:checked="${business?.enableLeaders}" disabled>
                                </div>
                                <label class="col-sm-2 col-form-label" style="white-space: nowrap">
                                    <strong>Arver rettigheder</strong>
                                    <span style="margin-left: 5px; cursor: pointer;" data-toggle="tooltip" data-placement="top" th:attrappend="title=${@cmsMessageBundle.getText('cms.inherit.privileges')}">
                                        <i class="fa fa-fw fa-info-circle" aria-hidden="true"></i>
                                    </span>
                                </label>
                                <div class="col-sm-10 d-flex align-content-center">
                                    <input type="checkbox" class="i-checks" id="inheritPrivileges" th:checked="${business?.inheritPrivileges}" disabled>
                                </div>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h4 style="margin: 0;">Tilknyttede ledere</h4>
                            </div>
                            <div class="table-responsive" style="margin-bottom: 20px;">
                                <table id="leaderTable" class="table table-striped table-bordered table-hover dataTable">
                                    <thead>
                                    <tr>
                                        <th>Navn</th>
                                        <th>Email</th>
                                        <th>Login ID</th>
                                        <th>Handlinger</th>
                                    </tr>
                                    </thead>
                                    <tfoot style="display: table-row-group">
                                    <tr>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td></td>
                                    </tr>
                                    </tfoot>
                                    <tbody>
                                    <tr th:each="leader : ${leaders}">
                                        <td th:text="${leader.name}"></td>
                                        <td th:text="${leader.mail}"></td>
                                        <td th:text="${leader.identifier}"></td>
                                        <td>
                                            <a th:href="@{/leader/edit/{id}(id=${leader.id})}" style="color: inherit;"><em class="fa fa-fw fa-pencil"></em></a>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div>
                                <h4>Medarbejdere</h4>
                            </div>
                            <div class="table-responsive">
                                <table id="affiliatedTable" class="table table-striped table-bordered table-hover" >
                                    <thead>
                                    <tr>
                                        <th>Navn</th>
                                        <th>E-Mail</th>
                                        <th>Mobilnummer</th>
                                        <th>Start/Stop dato</th>
                                    </tr>
                                    </thead>

                                    <tfoot style="display: table-row-group">
                                    <tr>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter">
                                            <div class="input-group input-group-sm">
                                                <input type="text" class="form-control date-filter" placeholder="DD/MM/ÅÅÅÅ" />
                                                <span class="input-group-addon">
                                                    <i class="fa fa-calendar"></i>
                                                </span>
                                            </div>
                                        </td>
                                        </td>
                                    </tr>
                                    </tfoot>

                                    <tbody>
                                    <tr th:each="employee : ${employees}">
                                        <td th:text="${employee?.name}" th:value="${employee.id}"></td>
                                        <td th:text="${employee?.email}" th:value="${employee.id}"></td>
                                        <td th:text="${employee?.phone}" th:value="${employee.id}"></td>
                                        <td th:text="${employee?.period}" th:value="${employee.id}"></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/footer :: scripts (datatables = true, texteditor = true, codemirror = true, datepicker = true, checkbox = true)}"></div>
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
</div>
<script type="module" th:src="@{/js/admin/business/businessDetails.js}"></script>
</body>
</html>
