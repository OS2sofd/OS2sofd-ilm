<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true, datepicker = true)}"></head>
<body class="top-navigation">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidemenu (admin = true, page = 'business')}"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar (page = 'business')}"></div>
        <div class="wrapper wrapper-content">
            <div class="row" id="companies">
                <div class="col-md-12" style="margin-top: 20px">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-fw fa-building"></em> &nbsp; Virksomheder </h5>
                        </div>

                        <div class="ibox-content" >
                            <p>
                                Her har du et overblik over alle virksomheder i systemet og har mulighed for at oprette og redigere dem.
                            </p>
                            <button th:if="${isAdmin || isLeader}" type="button" onclick="window.location.href='/business/create';" style="float: right" class="btn btn-w-m btn-primary">Opret</button>
                            <div class="table-responsive">
                                <table id="businessTable" class="table table-striped table-bordered table-hover" >
                                    <thead>
                                    <tr>
                                        <th>Navn</th>
                                        <th>CVR</th>
                                        <th>Virksomhedsprefix</th>
                                        <th>Handlinger</th>
                                    </tr>
                                    </thead>

                                    <tfoot style="display: table-row-group">
                                    <tr>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td></td>
                                    </tr>
                                    </tfoot>

                                    <tbody>
                                    <tr th:each="business : ${businesses}">
                                        <td th:text="${business.name}" th:value="${business.id}"></td>
                                        <td th:text="${business.cvr}" th:value="${business.id}"></td>
                                        <td th:text="${business.prefix}" th:value="${business.id}"></td>
                                        <td>
                                            <span>
                                                <a th:data-id="${business.id}" onclick="businessService.openDetails(this)"><em class="fa fa-fw fa-search"></em></a>
                                                <a th:if="${isAdmin || isLeader}" th:data-id="${business.id}" onclick="businessService.editAgency(this)"><em class="fa fa-fw fa-pencil"></em></a>
                                                <a th:if="${isAdmin || isLeader}" th:data-id="${business.id}" onclick="businessService.deleteAgency(this)"><em class="fa fa-fw fa-times"></em></a>
                                            </span>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/footer :: scripts (datatables = true, datepicker = true)}"></div>
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
</div>
<script type="text/javascript" th:src="@{/js/admin/business/business.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
