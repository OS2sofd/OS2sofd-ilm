<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true, texteditor = true)}"></head>
<body class="top-navigation">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidemenu (admin = true, page = 'auditlog')}"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar (page = 'auditlog')}"></div>
        <div class="wrapper wrapper-content">
            <div class="row" id="auditLog">
                <div class="col-md-12" style="margin-top: 20px">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-fw fa-history"></em> &nbsp; Auditlog</h5>
                        </div>

                        <div class="ibox-content" >
                            <p>
                            Nedenfor listes alle opsamlede logdata. Man kan anvende søgefelter over hver kolonne for at filtrere loggen, samt
                            klikke på den enkelte overskrift for at sortere efter den valgte kolonne.
                            </p>
                            <div>
                                <h4>Logdata</h4>
                                <div class="input-group" style="float: right; width: 150px">
                                    <select id="auditInterval" class="form-control">
                                        <option th:value="monthly">Månedlig</option>
                                        <option th:value="yearly">Årligt</option>
                                    </select>
                                    <span class="input-group-append">
                                    <button class="btn btn-primary" id="downloadReport" type="button"><em class="fa fa-fw fa-download"></em></button>
                                    </span>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <table id="eventLog" class="table table-striped table-bordered table-hover" >
                                    <thead>
                                    <tr>
                                        <th style="width: 110px;">Tidspunkt</th>
                                        <th style="width: 80px;">Aktør</th>
                                        <th style="width: 160px;">Målobjekt</th>
                                        <th style="width: 200px;">Hændelsestype</th>
                                        <th>Hændelse</th>
                                        <th>Handlinger</th>
                                    </tr>
                                    </thead>

                                    <tfoot style="display: table-row-group">
                                    <tr>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter">
                                            <select id="logActionFilter" class="form-control" style="width: 100%;">
                                                <option selected="selected" value="">Alle</option>
                                                <option th:each="logAction : ${logactions}"
                                                        th:value="${logAction}"
                                                        th:text="${logAction?.type.getTranslation()}">
                                                </option>
                                            </select>
                                        </td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td></td>
                                    </tr>
                                    </tfoot>
                                    <tbody>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/footer :: scripts (datatables = true, texteditor = true)}"></div>
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
</div>
<script type="module" th:src="@{/js/admin/auditlog/auditlog.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
