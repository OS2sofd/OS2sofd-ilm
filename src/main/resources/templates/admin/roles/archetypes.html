<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true)}"></head>
<body class="top-navigation">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidemenu (admin = true, page = 'archetypes')}"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar (page = 'archetypes')}"></div>
        <div class="wrapper wrapper-content">
            <div class="row" id="archetypes">
                <div class="col-md-12" style="margin-top: 20px">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-fw fa-tags"></em> &nbsp; Arketyper </h5>
                        </div>

                        <div class="ibox-content" >
                            <p>
                                Her har du et overblik over alle arketyper i systemet. Det er dem du tildeler en medarbejder for at give dem roller.
                            </p>
                            <button th:if="${isAdmin || isLeader}" type="button" onclick="window.location.href='/archetype/create';" style="float: right" class="btn btn-w-m btn-primary">Opret</button>
                            <div class="table-responsive">
                                <table id="archetypeTable" class="table table-striped table-bordered table-hover" >
                                    <thead>
                                    <tr>
                                        <th>Navn</th>
                                        <th>Handlinger</th>
                                    </tr>
                                    </thead>

                                    <tfoot style="display: table-row-group">
                                    <tr>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td></td>
                                    </tr>
                                    </tfoot>

                                    <tbody>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/footer :: scripts (datatables = true)}"></div>
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
</div>
<div style="display: none;" id="isAdmin" th:data-admin="${isAdmin}"></div>
<div style="display: none;" id="isLeader" th:data-leader="${isLeader}"></div>
<script type="text/javascript" th:src="@{/js/admin/roles/archetypes.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
