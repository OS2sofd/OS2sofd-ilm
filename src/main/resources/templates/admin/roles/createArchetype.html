<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true, checkbox = true)}"></head>
<body class="top-navigation">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidemenu (admin = true, page = 'archetype')}"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar}"></div>
        <div class="wrapper wrapper-content">
            <div class="row" id="createArchetype">
                <div class="col-md-12" style="margin-top: 20px">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-fw fa-plus"></em> &nbsp; Opret arketype </h5>
                        </div>

                        <div class="ibox-content" >
                            <h4>Stamdata</h4>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label"><strong>Navn</strong></label>
                                <div class="col-sm-10">
                                    <input id="createEmployeeName" class="form-control" placeholder="Navn">
                                </div>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h4 style="margin: 0;">Tilføj grupper</h4>
                            </div>
                            <div class="table-responsive">
                                <table id="groupTable" class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr>
                                        <th>Navn</th>
                                        <th>Handlinger</th>
                                    </tr>
                                    </thead>

                                    <tfoot style="display: table-row-group">
                                    <tr>
                                        <td class="input-filter">
                                            <input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" />
                                        </td>
                                        <td></td>
                                    </tr>
                                    </tfoot>

                                    <tbody>
                                    <tr th:each="group : ${groups}">
                                        <td th:text="${group.name}" th:value="${group.id}"></td>
                                        <td>
                                            <input type="checkbox"
                                                   th:id="${'groupChoice' + group.id}"
                                                   class="i-checks modalChecks"
                                                   th:data-id="${group.id}"
                                                   onchange="createArchetypeService.updateGroup(this)">
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h4 style="margin: 0;">Tilføj roller</h4>
                            </div>
                            <div class="table-responsive">
                                <table id="roleTable" class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr>
                                        <th>Navn</th>
                                        <th>It-system</th>
                                        <th>Beskrivelse</th>
                                        <th>Handlinger</th>
                                    </tr>
                                    </thead>
                                    <tfoot style="display: table-row-group">
                                    <tr>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                        <td></td>
                                    </tr>
                                    </tfoot>
                                    <tbody>
                                    <tr th:each="role : ${roles}">
                                        <td th:value="${role.id}" th:text="${role?.name}"></td>
                                        <td th:value="${role.id}" th:text="${role?.itSystem?.name}"></td>
                                        <td th:value="${role.id}" th:text="${role?.description}"></td>
                                        <td>
                                            <input type="checkbox" th:id="${'roleChoice' + role.id}" class="i-checks modalChecks" th:data-id="${role.id}" onchange="createArchetypeService.updateRole(this)">
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="ibox-footer" style="padding-right: 0 !important;">
                                <div class="text-right">
                                    <button id="annuller" onclick="createArchetypeService.cancelButton()" class="btn btn-w-m btn-danger">Annuller</button>
                                    <button onclick="createArchetypeService.saveCreatedArchetype()" id="bekræft" class="btn btn-w-m btn-primary">Bekræft</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/footer :: scripts (datatables = true, checkbox = true)}"></div>
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
</div>
<script type="text/javascript" th:src="@{/js/admin/roles/createArchetype.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
