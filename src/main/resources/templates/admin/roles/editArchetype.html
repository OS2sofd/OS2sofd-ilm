<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true, checkbox = true)}"></head>
<link rel="stylesheet" th:href="@{/css/ibox-footer-styling.css}">
<body class="top-navigation">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidemenu (admin = true, page = 'archetype')}"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar}"></div>
        <div class="wrapper wrapper-content">
            <div class="row" id="editArchetype">
                <div class="col-md-12" style="margin-top: 20px">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-fw fa-edit"></em> &nbsp; Rediger arketype </h5>
                        </div>

                        <div class="ibox-content" >
                            <h4>Stamdata</h4>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label"><strong>Navn</strong></label>
                                <div class="col-sm-10">
                                    <input id="editArchetypeName" class="form-control" th:value="${archetype?.name}">
                                </div>
                            </div>
                            <h4>Active directory</h4>
                            <hr>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h4 style="margin: 0;">Tilknyttede grupper</h4>
                            </div>
                            <div class="form-group row">
                                <div class="table-responsive">
                                    <table id="groupTable" class="table table-striped table-bordered table-hover">
                                        <thead>
                                        <tr>
                                            <th>Navn</th>
                                            <th>Handlinger</th>
                                        </tr>
                                        </thead>

                                        <tfoot style="display: table-row-group">
                                        <tr>
                                            <td class="input-filter">
                                                <input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" />
                                            </td>
                                            <td></td>
                                        </tr>
                                        </tfoot>

                                        <tbody>
                                        <tr th:each="group : ${groups}">
                                            <td th:text="${group?.name}" th:value="${group.id}"></td>
                                            <td>
                                                <input type="checkbox"
                                                       th:id="${'groupChoice' + group.id}"
                                                       class="i-checks modalChecks updateGroupBtn"
                                                       th:data-id="${group.id}"
                                                       th:checked="${archetype.adGroups.contains(group)}">
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <h4>Rollekatalog</h4>
                            <hr>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h4 style="margin: 0;">Tilknyttede roller</h4>
                            </div>
                            <div class="form-group row">
                                <div class="table-responsive">
                                    <table id="roleTable" class="table table-striped table-bordered table-hover">
                                        <thead>
                                        <tr>
                                            <th>Navn</th>
                                            <th>It-system</th>
                                            <th>Beskrivelse</th>
                                            <th>Handlinger</th>
                                        </tr>
                                        </thead>
                                        <tfoot style="display: table-row-group">
                                        <tr>
                                            <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                            <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                            <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" /></td>
                                            <td></td>
                                        </tr>
                                        </tfoot>
                                        <tbody>
                                        <tr th:each="role : ${roles}">
                                            <td th:value="${role.id}" th:text="${role?.name}"></td>
                                            <td th:value="${role.id}" th:text="${role?.itSystem?.name}"></td>
                                            <td th:value="${role.id}" th:text="${role?.description}"></td>
                                            <td>
                                                <input type="checkbox"
                                                       th:id="${'roleChoice' + role.id}"
                                                       class="i-checks modalChecks updateRoleBtn"
                                                       th:data-id="${role.id}"
                                                       th:checked="${archetype.userRoles.contains(role)}">
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h4 style="margin: 0;">Tilknyttede rollebuketter</h4>
                            </div>
                            <div class="form-group row">
                                <div class="table-responsive">
                                    <table id="roleGroupTable" class="table table-striped table-bordered table-hover">
                                        <thead>
                                        <tr>
                                            <th>Navn</th>
                                            <th>Beskrivelse</th>
                                            <th>Handlinger</th>
                                        </tr>
                                        </thead>

                                        <tfoot style="display: table-row-group">
                                        <tr>
                                            <td class="input-filter">
                                                <input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Søg" />
                                            </td>
                                            <td></td>
                                        </tr>
                                        </tfoot>

                                        <tbody>
                                        <tr th:each="rg : ${roleGroups}">
                                            <td th:text="${rg?.name}" th:value="${rg.id}"></td>
                                            <td th:text="${rg?.description}" th:value="${rg.id}"></td>
                                            <td>
                                                <input type="checkbox"
                                                       th:id="${'roleGroupChoice' + rg.id}"
                                                       class="i-checks modalChecks updateRoleGroupBtn"
                                                       th:data-id="${rg.id}"
                                                       th:checked="${archetype.roleGroups.contains(rg)}">
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                        <div class="ibox-footer">
                            <div class="form-group row">
                                <div class="col-sm-12 text-right">
                                    <button id="cancel" class="btn btn-w-m btn-danger">Annuller</button>
                                    <button id="confirm" th:data-id="${archetype.id}" class="btn btn-w-m btn-primary">Gem</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/footer :: scripts (datatables = true, checkbox = true)}"></div>
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
</div>
<script type="module" th:src="@{/js/admin/roles/editArchetype.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
