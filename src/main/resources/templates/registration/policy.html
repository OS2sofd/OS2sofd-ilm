<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (checkbox = true, slimScroll = true)}"></head>
<body class="top-navigation">
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg">
        <div class="wrapper wrapper-content">
            <div class="row" id="policy">
                <div class="col-md-12" style="margin-top: 20px">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h4>Generelle vilkår og privatlivspolitik</h4>
                        </div>
                        <div class="ibox-content">
                            <div class="scrollable-content" style="position: relative; width: auto; max-height: 500px; overflow-y: auto;">
                                <p th:utext="${@cmsMessageBundle.getText('cms.tos.text')}"></p>
                            </div>
                            <div class="ibox-footer">
                                <div class="form-group row">
                                    <div class="col-lg-4">
                                        <input type="checkbox" id="acceptedTOS" class="i-checks">
                                        &nbsp;<strong>Jeg accepter vilkår og privatlivspolitik</strong>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <button type="button" th:data-id="${employeeId}" class="btn btn-primary" id="acceptTerms">Send</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
        <div th:replace="~{fragments/footer :: scripts (checkbox = true, slimScroll = true)}"></div>
    </div>
</div>
<script type="module" th:src="@{/js/registration/policy.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
