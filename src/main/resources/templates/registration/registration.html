<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (checkbox = true, slimScroll = false)}"></head>
<body class="top-navigation">
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/empty-navbar :: emptyTopBar (registration = true)}"></div>
        <div class="wrapper wrapper-content">
            <div class="row" id="auditLog">
                <div class="col-md-12" style="margin-top: 20px">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h3><em class="fa fa-fw fa-user-circle"></em> &nbsp; Registrering</h3>
                        </div>
                        <div class="ibox-content" >
                            <p>
                                <h3 th:with="name=${@securityUtil.getName()}">
                                    <p th:if="${#strings.isEmpty(name)}" id="name" th:text="${'Hej'}"></p>
                                    <p th:unless="${#strings.isEmpty(name)}" id="name" th:text="${'Hej ' + name}"></p>
                                </h3>
                            </p>
                            <input type="text" style="display: none;">
                            <p>
                                Ved at udfylde denne blanket kan du anmode om at blive oprettet som konsulent i løsningen.
                            </p>
                            <div class="form-group">
                                <div class="row mb-2">
                                    <div class="col-md-1 d-flex align-items-center">
                                        <label class="me-2"><strong>Navn</strong></label>
                                    </div>
                                    <div class="col-md-2">
                                        <input id="requestName" class="form-control" th:value="${@securityUtil.getName()}">
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-md-1 d-flex align-items-center">
                                        <label class="me-2"><strong>E-Mail</strong></label>
                                    </div>
                                    <div class="col-md-2">
                                        <input id="requestMail" type="email" class="form-control" placeholder="E-Mail">
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-md-1 d-flex align-items-center">
                                        <label class="me-2"><strong>E-Mail på leder</strong></label>
                                    </div>
                                    <div class="col-md-2">
                                        <input id="requestLeaderMail" type="email" class="form-control" placeholder="E-Mail">
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-md-1 d-flex align-items-center">
                                        <label class="me-2"><strong>Mobilnummer (Optionelt)</strong></label>
                                    </div>
                                    <div class="col-md-2">
                                        <input id="requestPhone" class="form-control" placeholder="Mobil nr.">
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="row mb-2">
                                    <div class="col-md-1 d-flex align-items-center">
                                        <label class="form-check-label" th:readonly="${cvr != ''}" for="hasCvr">Jeg har et CVR nummer</label>
                                    </div>
                                    <div class="col-md-2">
                                        <input th:checked="${cvr != ''}" type="checkbox" class="i-checks form-check-input" id="hasCvr" onchange="registrationService.toggleCvrFields()">
                                    </div>
                                </div>

                                <!-- CVR input fields - shown/hidden based on the checkbox above -->
                                <div id="cvrInputFields" style="display: none;">
                                    <div class="row mb-2">
                                        <div class="col-md-1 d-flex align-items-center">
                                            <label class="form-label"><strong>CVR nummer</strong></label>
                                        </div>
                                        <div class="col-md-2">
                                            <input type="text"
                                                   class="form-control searchCvr"
                                                   id="cvrNumber"
                                                   onchange="registrationService.onCvrSearch()"
                                                   th:value="${cvr != '' ? cvr : ''}"
                                                   placeholder="Søg et cvr nr.">
                                            <label style="display: none;" id="businessName"></label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <p>
                                Angiv din stilling i virksomheden:
                            </p>
                            <div class="row mb-2">
                                <div class="col-md-1 d-flex align-items-center">
                                    <label class="me-2"><strong>Stilling</strong></label>
                                </div>
                                <div class="col-md-2">
                                    <input id="positionName" class="form-control" placeholder="Stilling">
                                </div>
                            </div>
                            <div class="text-right">
                                <a style="color: dodgerblue" onclick="registrationService.openTosModal()">Vilkår og privatlivspolitik<em class="fa fa-fw fa-file"></em></a>
                                <button type="button" class="btn btn-primary" id="butRateTypeCreate" onclick="registrationService.sendRegistration()">Send</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
        <div th:replace="~{fragments/footer :: scripts (checkbox = true, slimScroll = true)}"></div>
    </div>
</div>
<div class ="modal inmodal" id="tosModal" style="display: none; width: 100%;" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content animated fadeIn">
            <div class="modal-header" style="max-height: 0px !important">
                <H4>
                    <strong>Generelle vilkår og privatlivspolitik</strong>
                </H4>
            </div>
            <div class="modal-body white-bg">
                <div class="ibox-content" id="iboxcontent">
                    <div class="scrollable-content" style="position: relative; width: auto; max-height: 500px; overflow-y: auto;">
                        <p th:utext="${@cmsMessageBundle.getText('cms.tos.text')}"></p>
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="max-height: 60px !important;">
                <div style="margin-top: 10px">
                    <div class="form-group row">
                        <div class="col-lg-12">
                            <input type="checkbox" id="acceptedTOS" class="i-checks" onchange="registrationService.closeTosModal()">
                            &nbsp;<strong>Jeg accepter vilkår og privatlivspolitik</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/footer :: scripts (checkbox = true, slimScroll = false)}"></div>
</div>
<script type="text/javascript" th:src="@{/js/registration/registration.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
