<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (checkbox = true, slimScroll = false)}"></head>
<link rel="stylesheet" th:href="@{/css/registration.css}">
<body class="top-navigation">
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/empty-navbar :: emptyTopBar (registration = true)}"></div>
        <div class="wrapper wrapper-content">
            <div class="middle-box text-center animated fadeInDown">
                <div>
                    <div class="text-center mb-4">
                        <a th:href="@{/dashboard}" th:unless="${@cmsMessageBundle.getText('cms.logo') == ''}">
                            <img id="landingPageLogo" class="img-fluid" th:src="${'data:image/png;base64,' + @cmsMessageBundle.getText('cms.logo')}" alt="ilmLogo">
                        </a>
                    </div>

                    <div th:unless="${@cmsMessageBundle.getText('cms.logo') != ''}">
                        <h1 class="logo-name" id="logo-name">OS2ilm</h1>
                    </div>
                    <h3>Registrer til OS2ilm</h3>
                    <p>Ved at udfylde denne blanket kan du anmode om at blive oprettet som medarbejder i løsningen.</p>
                    <div>
                        <div class="form-group info-icon-wrapper">
                            <input id="requestName" class="form-control" th:value="${nameFromMitId}" th:readonly="${nameLocked}" placeholder="Navn">
                            <span class="info-icon" data-toggle="tooltip" data-trigger="hover click" data-placement="right" th:title="${nameLocked} ? 'Navnet kommer fra MitID og kan ikke ændres' : 'Indtast dit fulde navn som det skal fremgå i systemet'"><i class="fa fa-info-circle"></i></span>
                        </div>
                        <div class="form-group info-icon-wrapper" th:if="${cpr != null}">
                            <input id="requestCpr" class="form-control" th:value="${cpr}" readonly placeholder="CPR-nummer">
                            <span class="info-icon" data-toggle="tooltip" data-trigger="hover click" data-placement="right" title="CPR-nummeret kommer fra MitID og kan ikke ændres"><i class="fa fa-info-circle"></i></span>
                        </div>
                        <div class="form-group info-icon-wrapper">
                            <input id="requestMail" type="email" class="form-control" placeholder="Email">
                            <span class="info-icon" data-toggle="tooltip" data-trigger="hover click" data-placement="right" title="Din arbejdsmailadresse bruges til notifikationer"><i class="fa fa-info-circle"></i></span>
                        </div>
                        <div class="form-group info-icon-wrapper leaderFlow" hidden>
                            <input id="requestLeaderMail" type="email" class="form-control" placeholder="Leder-email">
                            <span class="info-icon" data-toggle="tooltip" data-trigger="hover click" data-placement="right" title="Din leders email bruges til at indhente godkendelse for din adgang"><i class="fa fa-info-circle"></i></span>
                        </div>
                        <div class="form-group info-icon-wrapper">
                            <input id="requestPhone" class="form-control" th:placeholder="${requirePhone} ? 'Mobil nr.' : 'Mobil nr. (valgfri)'" th:data-required="${requirePhone}">
                            <span class="info-icon" data-toggle="tooltip" data-trigger="hover click" data-placement="right" title="Dit mobilnummer bruges til notifikationer"><i class="fa fa-info-circle"></i></span>
                        </div>
                        <div class="form-group textarea-wrapper">
                            <div class="panel panel-default info-icon-wrapper">
                                <textarea class="form-control panel-body" name="requestReason" rows="3" id="requestReason" th:data-required="${requireRegistrationReason}" th:placeholder="${requireRegistrationReason} ? 'Årsag' : 'Årsag (valgfri)'"></textarea>
                                <span class="info-icon" data-toggle="tooltip" data-trigger="hover click" data-placement="right" title="Beskriv kort, hvad du skal bruge OS2ILM til"><i class="fa fa-info-circle"></i></span>
                            </div>
                        </div>
                        <div class="form-group info-icon-wrapper">
                            <input id="positionName" class="form-control" placeholder="Stilling">
                            <span class="info-icon" data-toggle="tooltip" data-trigger="hover click" data-placement="right" title="Angiv din stilling eller jobtitel"><i class="fa fa-info-circle"></i></span>
                        </div>
                        <div class="form-group">
                            <input th:checked="${cvr != ''}" type="checkbox" class="i-checks form-check-input" id="hasCvr">
                            <label class="form-check-label" th:readonly="${cvr != ''}" for="hasCvr">Jeg har et CVR nummer</label>
                        </div>
                        <div class="form-group">
                            <div id="cvrInputFields" style="display: none;">
                                <div class="info-icon-wrapper">
                                    <input type="text"
                                           class="form-control searchCvr"
                                           id="cvrNumber"
                                           th:value="${cvr != '' ? cvr : ''}"
                                           placeholder="CVR-nummer">
                                    <span class="info-icon" data-toggle="tooltip" data-trigger="hover click" data-placement="right" title="Indtast dit 8-cifrede CVR-nummer for at tilknytte din virksomhed"><i class="fa fa-info-circle"></i></span>
                                </div>
                                <label id="businessName" hidden></label>
                            </div>
                        </div>
                    </div>
                </div>
                <div>
                    <a style="color: dodgerblue" id="openTosModalBtn">Vilkår og privatlivspolitik<em class="fa fa-fw fa-file"></em></a>
                </div>
                <div class="m-t">
                    <button type="button" class="btn btn-primary" id="butRateTypeCreate">Registrer</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class ="modal inmodal" id="tosModal" style="display: none; width: 100%;" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content animated fadeIn">
            <div class="modal-header" style="max-height: 0px !important">
                <H4>
                    <strong>Generelle vilkår og privatlivspolitik</strong>
                </H4>
            </div>
            <div class="modal-body white-bg">
                <div class="ibox-content" id="iboxcontent">
                    <div class="scrollable-content" style="position: relative; width: auto; max-height: 500px; overflow-y: auto;">
                        <p th:utext="${@cmsMessageBundle.getText('cms.tos.text')}"></p>
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="max-height: 60px !important;">
                <div style="margin-top: 10px">
                    <div class="form-group row">
                        <div class="col-lg-12">
                            <input type="checkbox" id="acceptedTOS" class="i-checks">
                            &nbsp;<strong>Jeg accepter vilkår og privatlivspolitik</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts (checkbox = true, slimScroll = true)}"></div>
<script type="module" th:src="@{/js/registration/registration.js}"></script>
<script type="module" th:src="@{/js/fragments/logout-button.js}"></script>
</body>
</html>
