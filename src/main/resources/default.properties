server.port=9050

server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.remote-ip-header=x-forwarded-for

## Hikari
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## Actuator
management.endpoints.web.base-path=/manage

## persistent cookie, 4 hours expiry
server.servlet.session.persistent=true
server.servlet.session.cookie.max-age=14400
server.servlet.session.timeout=4h

## session JDBC
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=SPRING_SESSION
spring.session.jdbc.cleanup-cron=${random.int(60)} ${random.int(5)}/5 * * * *

spring.jpa.open-in-view=false

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

## saml module default config
di.saml.pages.success=/
di.saml.pages.nonsecured=/,/discovery,/manage/**,/error,/webjars/**,/login,/login/**,/css/**,/js/**,/img/**,/favicon.ico,/api/**,/register,/landing-page
di.saml.pages.chooseIdentityProvider=/discovery
di.saml.idp.discovery=true

# Show git info in /manage/info
management.info.git.enabled=true
management.info.git.mode=simple
management.endpoints.web.exposure.include=health,info

# Hide infoContributors (most are disabled by default anyway but just in case)
management.info.build.enabled=false
management.info.env.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false
management.info.process.enabled=false
management.info.ssl.enabled=false
